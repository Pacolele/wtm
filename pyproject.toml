[project]
name = "wtm"
version = "0.1.0"
description = "Terminal UI for managing git worktrees across repos and launching kiro-cli in them"
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly: Textual's widget APIs move between majors.
    "textual==8.2.8",
    # Big block-letter repo name in the banner (terminals can't scale fonts).
    "pyfiglet==1.0.4",
]

[project.scripts]
wtm = "wtm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wtm"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
